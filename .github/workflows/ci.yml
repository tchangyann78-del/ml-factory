name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur une PR annule l'exécution précédente (économie de minutes)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Principe du moindre privilège : lecture seule par défaut pour tous les jobs
permissions:
  contents: read

jobs:
  quality:
    name: Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip                     # cache des paquets, clé = hash des requirements
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      # Fail-fast : les contrôles les plus rapides d'abord
      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatage (ruff format --check)
        run: ruff format --check .

      - name: Entraîner le modèle (nécessaire aux tests)
        run: python scripts/train.py

      - name: Tests + couverture (seuil défini dans pyproject.toml)
        run: pytest --cov-report=xml

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Build, Scan & Publish
    needs: quality               # fail-fast : image construite seulement si lint + tests sont verts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write            # nécessaire uniquement ici, pour pousser sur ghcr.io
    env:
      LOCAL_IMAGE: ml-factory:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Métadonnées de l'image (tags + labels OCI)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build de l'image (chargée en local, pas encore publiée)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de vulnérabilités (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test du conteneur
        run: |
          docker run -d --name api -p 8000:8000 "$LOCAL_IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Smoke test OK"
              exit 0
            fi
            sleep 2
          done
          echo "Le conteneur n'est jamais devenu sain" >&2
          docker logs api
          exit 1

      - name: Connexion à ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication sur ghcr.io (branche main uniquement)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha